[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-guardian"
version = "1.0.0"
description = "Auditoría, validación y protección de APIs para proyectos independientes y grandes empresas (OWASP API Top 10)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "David" }
]
keywords = ["api", "security", "owasp", "openapi", "diff-scan", "antigravity-skill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]

[project.scripts]
api-guardian = "api_guardian.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
fuzz = ["schemathesis>=3.20"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]
